apiVersion: v2
name: contacts
description: Helm umbrella chart for Contacts - a Google Contacts management application
type: application
version: 0.9.0
appVersion: "1.0.0"

dependencies:
  - name: frontend
    version: "0.5.1"
    repository: "file://charts/frontend"

  - name: backend
    version: "0.6.2"
    repository: "file://charts/backend"

  - name: routes
    version: "0.5.1"
    repository: "file://charts/routes"
    condition: routes.enabled

  # Off when the cluster's shared PostgreSQL serves contactsdb instead; the
  # chart then renders an ExternalName Service under this chart's Service name
  # (templates/postgresql-external.yaml), so connection strings are unchanged.
  - name: postgresql
    version: "16.4.1"
    repository: ""
    condition: postgresql.enabled

  - name: redis
    version: "25.3.9"
    repository: ""
