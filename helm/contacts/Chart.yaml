apiVersion: v2
name: contacts
description: Helm umbrella chart for Contacts - a Google Contacts management application
type: application
version: 0.5.4
appVersion: "1.0.0"

dependencies:
  - name: frontend
    version: "0.4.2"
    repository: "file://charts/frontend"

  - name: backend
    version: "0.4.3"
    repository: "file://charts/backend"

  - name: routes
    version: "0.3.2"
    repository: "file://charts/routes"
    condition: routes.enabled

  - name: postgresql
    version: "16.4.1"
    repository: ""

  - name: redis
    version: "25.3.9"
    repository: ""
