{{- $np := .Values.global.networkPolicy -}}
{{- if $np.enabled }}
# Default-deny for the whole namespace (AD-51 rule 1): a pod that no other policy
# admits can neither receive nor send. Each chart pod has its own allow-list.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: contacts
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Every pod may reach cluster DNS, UDP and TCP 53 (AD-51 rule 1)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-dns
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: contacts
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.dns.podLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- if $np.backup.enabled }}
---
# The backup CronJob (AD-24, AD-55; not built yet): no ingress; Postgres, Vault for
# its agent, and TCP 443 to the public internet only (AD-51 rule 2)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: contacts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backup
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.global.postgresql.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.vault.namespace }}
      ports:
        - port: {{ $np.vault.port }}
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $np.privateRanges | nindent 14 }}
      ports:
        - port: 443
          protocol: TCP
{{- end }}
{{- end }}
