replicaCount: 1
image:
  repository: ghcr.io/mayafit/contacts-backend
  tag: latest
  pullPolicy: IfNotPresent
  pullSecret: ""
service:
  type: ClusterIP
  port: 5000

# Vault Agent Injector settings (overridden by umbrella chart)
vault:
  enabled: false
  kvPath: "secret/data/contacts"
  role: "contacts"
  authPath: "auth/kubernetes"
  # The agent's projected token (AD-51 rule 6): audience = the Vault role's audience;
  # "" asks for the API server's default audience
  tokenAudience: vault
  tokenExpirationSeconds: 3600
  # Render Redis__ConnectionString with the password from this Vault key (AD-50
  # rule 1). The backend parses it with StackExchange.Redis and the agent writes it
  # into a shell file, so the password must not contain , = " $ \ or a backtick
  # (generate it as hex)
  redisPasswordKey: Redis__Password
  # Only with migrations.initContainer: the custom agent config (AD-49 rule 3) names
  # the Vault server itself, as the injector's own config does not apply then
  address: "http://vault.vault.svc:8200"

# Row-level security (AD-49 rule 8): Shadow (log-only) until the logs show no
# "owner scope missing", then Enforce; policies on at rollout step 4
rowLevelSecurity:
  mode: Shadow
  policies: false

# The migrate-only init container (AD-49 rule 3). Off until db-roles.sql has run and
# the migration path holds Database__MigrationConnectionString (atlas_migrator); the
# backend's Vault role must read that path too. On: the API stops migrating at startup.
migrations:
  initContainer: false
  kvPath: "secret/data/contacts-migrate"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }

# Without Vault: the name of an existing Secret with the backend's secret env (AD-52
# rule 1: the chart renders no Secret and has no default values)
secrets:
  existingSecret: ""

# Restricted pod (AD-51 rule 5). The pod-level seccomp also covers the injected Vault
# Agent containers. The backend writes only /tmp (an emptyDir). Init containers added
# to this pod (the AD-49 migrate container) use containerSecurityContext too.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Network policy (AD-51 rule 2). Ingress on 5000 from the frontend, the routes pod
# (when routes.enabled) and these extra peers; egress to Postgres, Redis, the routes
# Service, Vault and TCP 443 on the public internet (Google, Microsoft, OpenSky, ...)
networkPolicy:
  extraIngressFrom: []

# The route-quality service (Epic 12). Set enabled together with the umbrella's
# routes.enabled: the backend then calls <release>-routes on /internal/v1 with
# Routes__BackendToken, and the fusion worker wakes it after each run.
routes:
  enabled: false
  port: 8080
