apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        # The agent logs in with the projected token below, which the injector mounts
        # into the agent containers only; the backend container gets no token (AD-51 rule 6)
        vault.hashicorp.com/agent-service-account-token-volume-name: vault-token
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.vault.kvPath | quote }}
        # Redis__ConnectionString is built from the Redis password (AD-50 rule 1) and
        # overrides the password-less one in the ConfigMap. Rendering only the keys the
        # backend uses, instead of every key, is story 21.21 (AD-52 rule 2)
        vault.hashicorp.com/agent-inject-template-env: |
          {{- include "backend.vaultEnvTemplate" . | nindent 10 }}
        {{- if .Values.migrations.initContainer }}
        # AD-49 rule 3: the agent's init container (run first) also renders the migrator's
        # credential for the migrate init container, which deletes it when done; the
        # sidecar's config renders only env (vault-agent-configmap.yaml)
        vault.hashicorp.com/agent-configmap: {{ include "backend.fullname" . }}-vault-agent
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/agent-inject-containers: "migrate,backend"
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "backend.fullname" . }}
      automountServiceAccountToken: false
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.migrations.initContainer }}
      {{- if not .Values.vault.enabled }}
      {{- fail "backend.migrations.initContainer needs backend.vault.enabled (the migrator's credential comes from Vault, AD-49 rule 3)" }}
      {{- end }}
      initContainers:
        # The Atlas migrations as atlas_migrator, then the credential is deleted before
        # the backend container starts (AD-49 rule 3). A failed run keeps the pod in Init
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              set -a
              . /vault/secrets/migrate
              set +a
              dotnet ContactsApi.WebApi.dll --migrate-only
              rm -f /vault/secrets/migrate
          envFrom:
            - configMapRef:
                name: {{ include "backend.fullname" . }}-config
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.vault.enabled }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /vault/secrets/env ]; then
                set -a
                . /vault/secrets/env
                set +a
              fi
              exec dotnet ContactsApi.WebApi.dll
          {{- end }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "backend.fullname" . }}-config
            {{- if not .Values.vault.enabled }}
            - secretRef:
                name: {{ required "backend.secrets.existingSecret is required when backend.vault.enabled is false (AD-52 rule 1)" .Values.secrets.existingSecret }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          # Takeout exports are downloaded here for as long as their reviews are read (AD-40)
          emptyDir:
            sizeLimit: 1Gi
        {{- if .Values.vault.enabled }}
        # The Vault Agent's login token: short-lived, audience-bound, mounted by the
        # injector into the agent containers only (AD-51 rule 6)
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.vault.tokenExpirationSeconds }}
                  {{- with .Values.vault.tokenAudience }}
                  audience: {{ . }}
                  {{- end }}
        {{- end }}
