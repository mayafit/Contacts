{{- $np := (.Values.global).networkPolicy | default dict -}}
{{- if $np.enabled }}
# The backend (AD-51 rule 2). Ingress on 5000 from the frontend's nginx and the routes
# pod (the routes chart's backend-ingress policy admits the same peers, AD-32 rule 7).
# Egress to Postgres, Redis, the routes service, Vault for its agent, and TCP 443 to
# the public internet only: no home network, tailnet or link-local address. DNS comes
# from the namespace-wide allow. The Kubernetes API is not needed: the pod mounts no
# ServiceAccount token outside the Vault Agent, which logs in through Vault.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if .Values.routes.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: routes
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
        {{- with .Values.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- with $np.nodeAddresses }}
    # Kubelet probes from the node (AA-18)
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.global.postgresql.port }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.global.redis.port }}
          protocol: TCP
    {{- if .Values.routes.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: routes
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.routes.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.vault.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.vault.namespace }}
      ports:
        - port: {{ $np.vault.port }}
          protocol: TCP
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $np.privateRanges | nindent 14 }}
      ports:
        - port: 443
          protocol: TCP
{{- end }}
