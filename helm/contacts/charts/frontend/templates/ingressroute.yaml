{{- if .Values.ingress.enabled }}
# Everything goes to the frontend nginx, which serves the SPA and proxies /api/
# to the backend itself (see configmap.yaml). Routing /api here as well used to
# strip the prefix the backend's routes depend on, and the Cloudflare tunnel
# reaches nginx directly anyway, so nginx is the one place /api is handled.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    # Frontend via hostname
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      priority: 10
      services:
        - name: {{ include "frontend.fullname" . }}
          port: {{ .Values.service.port }}
    # Frontend via IP (catch-all)
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: {{ include "frontend.fullname" . }}
          port: {{ .Values.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
