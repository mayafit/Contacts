{{- $np := (.Values.global).networkPolicy | default dict -}}
{{- if $np.enabled }}
# nginx (AD-51 rule 2): admitted from the tunnel on 8080; talks only to the backend
# (DNS comes from the namespace-wide allow)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- if .Values.ingress.enabled }}
        {{- toYaml .Values.networkPolicy.traefikFrom | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- with $np.nodeAddresses }}
    # Kubelet probes from the node (AA-18)
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 5000
          protocol: TCP
{{- end }}
