# Route quality (Epic 12, AD-32 to AD-36). Off until the tiles image and the
# echo_routes role exist (see README.md).
enabled: false

image:
  repository: ghcr.io/mayafit/contacts-routes
  tag: latest
  pullPolicy: IfNotPresent
  pullSecret: ""

# Valhalla 3.9.x. Story 12.1 pins the digest that lists linux/arm64
# (repository@sha256:...) and records it in architecture section 7.
valhalla:
  image: ghcr.io/valhalla/valhalla:3.9.1
  port: 8002
  threads: 2
  # 64 MiB tile cache instead of the 1 GB default (AD-36 rule 1)
  maxCacheSize: 67108864

# The monthly CI tiles build (AD-32 rule 3): FROM busybox, holding
# valhalla_tiles.tar, the region .poly outlines and graph.json
tiles:
  repository: ghcr.io/mayafit/contacts-routing-tiles
  # Placeholder until the first build publishes il-<yyyymmdd>
  tag: il-latest
  pullPolicy: IfNotPresent
  # Where the tiles image keeps its files
  sourceDir: /tiles
  # The tar's size + 25%, rounded up to 256Mi, at least 1Gi (AD-32 rule 4)
  sizeLimit: 2Gi

service:
  type: ClusterIP
  port: 8080

# Pinned by story 12.1's spike to the node with the most free RAM (AD-36 rule 2)
nodeSelector: {}

priorityClass:
  # Shared with the face worker when it arrives (AD-20); cluster-scoped
  create: true
  name: contacts-background
  value: -10

# AD-36 rule 1
resources:
  routes:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  valhalla:
    requests: { cpu: 100m, memory: 192Mi, ephemeral-storage: 1Gi }
    limits: { cpu: 1000m, memory: 512Mi, ephemeral-storage: 2Gi }
  init:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 64Mi }

# Non-secret settings (secrets come from Vault, see vault below)
config:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: "http://+:8080"
  DOTNET_RUNNING_IN_CONTAINER: "true"
  Routes__GraphJsonPath: /tiles/graph.json
  Routes__RegionsPath: /tiles

# Only Routes__ServiceToken, Routes__BackendToken and Routes__ConnectionString
# are exported into this pod (never the backend's own database credentials)
vault:
  enabled: false
  kvPath: "secret/data/contacts"
  role: "contacts-routes"
  # The Vault agent sidecar must reach Vault through the egress policy
  namespace: vault
  port: 8200

networkPolicy:
  enabled: true
  backendPort: 5000
  postgres:
    port: 5432
    podLabels:
      app.kubernetes.io/name: postgresql
  # Peers besides the frontend and the routes pod that may reach the backend
  # (e.g. a monitoring namespace); each entry is a NetworkPolicy "from" peer
  extraBackendIngressFrom: []

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 30
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 15
