{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "routes.fullname" . }}
  labels:
    {{- include "routes.labels" . | nindent 4 }}
# Used only by the Vault Agent, through a projected token; no RBAC (AD-51 rule 6)
automountServiceAccountToken: false
{{- end }}
