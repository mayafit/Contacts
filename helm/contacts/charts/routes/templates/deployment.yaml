{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "routes.fullname" . }}
  labels:
    {{- include "routes.labels" . | nindent 4 }}
spec:
  # Fixed at 1 while enabled (AD-33 rule 1): one engine, one scheduler
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "routes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "routes.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        # The agent logs in with the projected token below, mounted into the agent
        # containers only (AD-51 rule 6); only the routes container mounts the
        # rendered secrets, Valhalla does not
        vault.hashicorp.com/agent-service-account-token-volume-name: vault-token
        vault.hashicorp.com/agent-inject-containers: {{ ternary "migrate,routes" "routes" .Values.migrations.initContainer | quote }}
        vault.hashicorp.com/agent-inject-secret-env: {{ .Values.vault.kvPath | quote }}
        # Only the routes keys: the backend's database credentials never enter this pod
        vault.hashicorp.com/agent-inject-template-env: |
          {{- include "routes.vaultEnvTemplate" . | nindent 10 }}
        {{- if .Values.migrations.initContainer }}
        # AD-49 rule 3: only the agent's init container (run first) renders the migrator's
        # credential; the migrate init container deletes it (vault-agent-configmap.yaml)
        vault.hashicorp.com/agent-configmap: {{ include "routes.fullname" . }}-vault-agent
        vault.hashicorp.com/agent-init-first: "true"
        {{- end }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "routes.fullname" . }}
      automountServiceAccountToken: false
      priorityClassName: {{ .Values.priorityClass.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # The tiles image (busybox) copies its tar, Valhalla's config, the outlines and
        # graph.json into the emptyDir: no PersistentVolume, no download (AD-32 rule 4).
        # Valhalla reads the tar in place (mjolnir.tile_extract), as in spike 12.1
        - name: tiles
          image: "{{ .Values.tiles.repository }}:{{ .Values.tiles.tag }}"
          imagePullPolicy: {{ .Values.tiles.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              src={{ .Values.tiles.sourceDir }}
              cp "$src/valhalla_tiles.tar" "$src/valhalla.json" "$src/graph.json" "$src"/*.poly /data/
              for f in admins.sqlite timezones.sqlite; do [ ! -f "$src/$f" ] || cp "$src/$f" /data/; done
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.init | nindent 12 }}
          volumeMounts:
            - name: tiles
              mountPath: /data
        {{- if .Values.migrations.initContainer }}
        {{- if not .Values.vault.enabled }}
        {{- fail "routes.migrations.initContainer needs routes.vault.enabled (the migrator's credential comes from Vault, AD-49 rule 3)" }}
        {{- end }}
        # The routes migrations as routes_migrator, then the credential is deleted before
        # the routes container starts (AD-49 rule 3). A failed run keeps the pod in Init
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              set -a
              . /vault/secrets/migrate
              set +a
              dotnet EchoRoutes.Worker.dll --migrate-only
              rm -f /vault/secrets/migrate
          envFrom:
            - configMapRef:
                name: {{ include "routes.fullname" . }}-config
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- end }}
      containers:
        - name: routes
          {{- if or (not .Values.image.tag) (eq (toString .Values.image.tag) "latest") }}
          {{- fail "routes.image.tag must be an explicit tag (the image's short sha), not empty or latest" }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.vault.enabled }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /vault/secrets/env ]; then
                set -a
                . /vault/secrets/env
                set +a
              fi
              exec dotnet EchoRoutes.Worker.dll
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "routes.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.routes | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tiles
              mountPath: /tiles
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: valhalla
          image: {{ .Values.valhalla.image | quote }}
          # The config shipped in the tiles image (paths under /data, loopback only,
          # no tile URL, no elevation download), with the spike's thread count
          command: ["valhalla_service", {{ .Values.valhalla.config | quote }}, {{ .Values.valhalla.threads | quote }}]
          # Listens on 127.0.0.1 only: reachable from the routes container, nothing else
          livenessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ .Values.valhalla.port }}/status', timeout={{ .Values.valhalla.livenessProbe.timeoutSeconds }})"]
            initialDelaySeconds: {{ .Values.valhalla.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.valhalla.livenessProbe.periodSeconds }}
            # The command's own timeout gives up first
            timeoutSeconds: {{ add .Values.valhalla.livenessProbe.timeoutSeconds 5 }}
            failureThreshold: {{ .Values.valhalla.livenessProbe.failureThreshold }}
          readinessProbe:
            exec:
              # python3 ships with the image (valhalla_build_config is Python); curl may not
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ .Values.valhalla.port }}/status', timeout={{ .Values.valhalla.readinessProbe.timeoutSeconds }})"]
            initialDelaySeconds: 10
            periodSeconds: {{ .Values.valhalla.readinessProbe.periodSeconds }}
            # The command's own timeout gives up first
            timeoutSeconds: {{ add .Values.valhalla.readinessProbe.timeoutSeconds 5 }}
            failureThreshold: {{ .Values.valhalla.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.valhalla | nindent 12 }}
          # Was root (the image declares no user); 1001 like the rest of the pod (AA-19)
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tiles
              mountPath: /data
              readOnly: true
            - name: valhalla-tmp
              mountPath: /tmp
      volumes:
        - name: tiles
          emptyDir:
            sizeLimit: {{ .Values.tiles.sizeLimit }}
        - name: tmp
          emptyDir: {}
        - name: valhalla-tmp
          emptyDir: {}
        {{- if .Values.vault.enabled }}
        # The Vault Agent's login token: short-lived, audience-bound, mounted by the
        # injector into the agent containers only (AD-51 rule 6)
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.vault.tokenExpirationSeconds }}
                  {{- with .Values.vault.tokenAudience }}
                  audience: {{ . }}
                  {{- end }}
        {{- end }}
{{- end }}
